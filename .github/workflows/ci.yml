name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: UmbHost.Tables.Client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: UmbHost.Tables.Client

      - name: Build client
        run: npm run build
        working-directory: UmbHost.Tables.Client

      # wwwroot is generated by vite but committed, so the package builds without node.
      # Fail when the two diverge, which means the TypeScript was changed without
      # rebuilding and the committed JavaScript is stale.
      - name: Check committed wwwroot is up to date
        run: |
          if ! git diff --exit-code -- UmbHost.Tables/wwwroot; then
            echo "::error::Committed wwwroot is stale. Run 'npm run build' in UmbHost.Tables.Client and commit the result."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack UmbHost.Tables/UmbHost.Tables.csproj --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*
