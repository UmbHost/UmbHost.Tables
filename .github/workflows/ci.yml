name: CI

on:
  push:
    branches:
      - main       # Umbraco 18 line
      - v17/main   # Umbraco 17 maintenance line
  pull_request:
    branches:
      - main
      - v17/main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: UmbHost.Tables.Client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: UmbHost.Tables.Client

      # Built from source so the packed JavaScript always matches the TypeScript in this
      # commit, whatever the committed wwwroot happens to contain.
      - name: Build client
        run: npm run build
        working-directory: UmbHost.Tables.Client

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack UmbHost.Tables/UmbHost.Tables.csproj --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*
